<!-- Simple sun icon for SunEatsSoup — save this as sun_icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- sun circle -->
  <circle cx="128" cy="96" r="56" fill="url(#g)" stroke="#ff9800" stroke-width="4"/>

  <!-- rays -->
  <g stroke="#ff9800" stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="8"  x2="128" y2="36"/>
    <line x1="128" y1="220" x2="128" y2="188"/>
    <line x1="8"   y1="96"  x2="36"  y2="96"/>
    <line x1="248" y1="96"  x2="220" y2="96"/>
    <line x1="44"  y1="28"  x2="66"  y2="50"/>
    <line x1="190" y1="182" x2="212" y2="204"/>
    <line x1="44"  y1="164" x2="66"  y2="142"/>
    <line x1="190" y1="30"  x2="212" y2="52"/>
  </g>

  <!-- eyes and smile (cute face) -->
  <circle cx="110" cy="86" r="6" fill="#5d4037"/>
  <circle cx="146" cy="86" r="6" fill="#5d4037"/>
  <path d="M104 108 Q128 128 152 108" fill="none" stroke="#5d4037" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bowl of soup (simple, bottom) -->
  <g transform="translate(0,90)">
    <!-- bowl -->
    <ellipse cx="128" cy="128" rx="90" ry="28" fill="#d81b60" stroke="#b0003a" stroke-width="4"/>
    <!-- soup -->
    <ellipse cx="128" cy="118" rx="80" ry="16" fill="#ffd54f" stroke="none" />
    <!-- steam -->
    <path d="M90 95 C94 80, 110 80, 114 95" fill="none" stroke="#bdbdbd" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 85 C144 70, 160 70, 164 85" fill="none" stroke="#bdbdbd" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
